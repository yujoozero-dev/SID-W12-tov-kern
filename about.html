<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note</title>
<meta name="description" content="Kern — 글자 사이 1/1000 em을 고르는 일.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<script>
/* 움직임을 써도 되는 환경에서만 html에 motion 표시를 단다. 스크립트가 꺼져 있거나 '동작 줄이기'가 켜져 있으면 완성된 글이 바로 보인다. */
(function(){var d=document.documentElement;
  if(!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)){d.classList.add('motion');}
})();
</script>
<style>
/* ===== 공통 (세 페이지 동일) ===== */
:root{
  --paper:#F5F4F0; --ink:#111110; --accent:#2436E8; --line:rgba(17,17,16,.9); --muted:rgba(17,17,16,.56);
  --serif:"Instrument Serif","Times New Roman",serif;
  --sans:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --pad:20px;
  --out3:cubic-bezier(.165,.84,.44,1);   /* 끝에서 느려지는 곡선 */
  --out2:cubic-bezier(.25,.46,.45,.94);
}
html[data-mode="dark"]{--paper:#111110; --ink:#F5F4F0; --accent:#93A0FF; --line:rgba(245,244,240,.9); --muted:rgba(245,244,240,.6)}
@media (min-width:700px){:root{--pad:40px}}
@media (min-width:1200px){:root{--pad:64px}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{min-height:100vh;min-height:100svh;background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;font-size:16px;line-height:1.8;
  word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background-color .4s var(--out2),color .4s var(--out2)}
html{transition:background-color .4s var(--out2)}
::selection{background:var(--ink);color:var(--paper)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--accent);outline-offset:4px}

.site-head{padding:0 var(--pad)}
.menu{display:flex;gap:28px;align-items:center;height:64px;border-bottom:1px solid var(--line);transition:border-color .4s var(--out2);
  font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:none}
.menu a{display:inline-block;padding:12px 0;color:var(--muted);transition:color .25s var(--out2)}
.menu a:hover{color:var(--ink)}
.menu a .in{display:inline-block;transition:transform .4s var(--out2)}
.menu a.is-back .in{transition:transform .6s cubic-bezier(.34,1.7,.5,1)}
.menu a[aria-current="page"]{color:var(--ink);font-weight:500}
.menu a[aria-current="page"] .in{box-shadow:0 1px 0 0 var(--accent);padding-bottom:3px}

main{padding:0 var(--pad) 96px}
.title{font-family:var(--serif);font-weight:400;line-height:.86;letter-spacing:-.02em;font-size:clamp(84px,19vw,300px);padding:clamp(40px,9vh,112px) 0 clamp(28px,5vh,56px)}
.sub{font-family:var(--serif);font-weight:400;font-style:italic;line-height:1;letter-spacing:-.01em;font-size:clamp(40px,6.4vw,100px)}
.meta{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted)}
.prose{max-width:36em}
.prose p+p{margin-top:1.4em}

/* 커서 (#6) — 마우스가 있는 기기에서만 켠다 */
.cur{position:fixed;left:0;top:0;z-index:999;pointer-events:none;opacity:0;transition:opacity .25s var(--out2);will-change:transform}
html.has-cursor .cur{opacity:1}
html.has-cursor.cursor-out .cur{opacity:0}
html.has-cursor,html.has-cursor *{cursor:none!important}
.cur-dot i{display:block;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--ink);transition:transform .25s var(--out2),background-color .4s var(--out2)}
.cur-ring i{display:block;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:1px solid var(--ink);
  transition:transform .25s var(--out2),border-color .25s var(--out2),background-color .25s var(--out2)}
.cur-ring b{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.06em;color:var(--paper);opacity:0;transition:opacity .2s var(--out2);white-space:nowrap}
.cur.is-hover.cur-ring i{transform:scale(1.8);border-color:var(--accent)}
.cur.is-hover.cur-dot i{background:var(--accent)}
.cur.is-label.cur-ring i{transform:scale(2.1);border-color:var(--ink);background:var(--ink)}
.cur.is-label.cur-ring b{opacity:1}
.cur.is-label.cur-dot i{transform:scale(0)}
.cur.is-down.cur-ring i{transform:scale(.8)}
.cur.is-hover.is-down.cur-ring i{transform:scale(1.5)}
.cur.is-label.is-down.cur-ring i{transform:scale(1.85)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

/* ===== about ===== */
.entry{border-top:1px solid var(--line);padding-top:28px;transition:border-color .4s var(--out2)}
.entry-head{display:flex;align-items:center;flex-wrap:wrap;gap:16px 28px;margin-bottom:32px}
.mode{display:inline-flex;align-items:center;gap:12px}
.switch{position:relative;width:52px;height:30px;border:1px solid var(--line);border-radius:0;background:transparent;transition:background-color .4s var(--out2),border-color .4s var(--out2)}
.switch::before{content:"";position:absolute;inset:-8px}
.switch .knob{position:absolute;left:3px;top:3px;width:22px;height:22px;background:var(--ink);transition:transform .25s var(--out2),background-color .4s var(--out2)}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"] .knob{transform:translateX(22px);background:var(--paper)}
.mode-word{position:relative;display:inline-block;overflow:hidden;height:1.8em;line-height:1.8em;min-width:3.2em;color:var(--ink)}
.mode-word span{display:block}
.mode-word .is-out{position:absolute;left:0;top:0;animation:word-out .16s cubic-bezier(.55,.085,.68,.53) forwards}
.mode-word .is-inn{animation:word-in .22s var(--out2) .16s both}
@keyframes word-out{to{transform:translateY(-6px);opacity:0}}
@keyframes word-in{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

</style>
</head>
<body>

<header class="site-head">
  <nav class="menu">
    <a href="index.html"><span class="in">Index</span></a>
    <a href="detail.html"><span class="in">Spacing</span></a>
    <a href="about.html" aria-current="page"><span class="in">Note</span></a>
  </nav>
</header>

<main>
  <h1 class="title">Note</h1>

  <section class="entry">
    <div class="entry-head">
      <h2 class="sub">Tov</h2>
      <div class="mode">
        <button type="button" class="switch" id="mode-switch" role="switch" aria-checked="false" aria-labelledby="mode-label"><span class="knob"></span></button>
        <span class="meta mode-word" id="mode-label"><span>Light</span></span>
      </div>
    </div>
    <div class="prose">
      <p>포스터를 만들 때 가장 오래 걸리는 일은 글자를 고르는 일이 아니라 글자 사이를 고르는 일이었다.<br>잘되면 아무도 알아채지 못한다는 점이 마음에 들었다.</p>
    </div>
  </section>
</main>

<script>
/* ===== 공통 ① 커서 (#6 커스텀 커서)
   점은 포인터에 바로 붙고, 링은 0.18초쯤 늦게 따라온다. 링크·버튼 위에서는 링이 1.8배로 커진다.
   data-cursor 가 적힌 곳에서는 링이 채워지고 그 글자가 링 안에 보인다. 터치 기기와 '동작 줄이기'에서는 만들지 않는다. */
(function(){
  var root=document.documentElement;
  var fine=window.matchMedia&&window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  if(!fine||!root.classList.contains('motion')){return;}
  var LAG=0.06;            /* 링이 따라오는 시간 상수(초). 0.06이면 0.18초쯤에 거의 붙는다 */
  var HOT='a,button,input,[data-cursor]';
  function make(cls,html){var e=document.createElement('div');e.className='cur '+cls;e.setAttribute('aria-hidden','true');e.innerHTML=html;document.body.appendChild(e);return e;}
  var dot=make('cur-dot','<i></i>'), ring=make('cur-ring','<i></i><b></b>'), label=ring.querySelector('b');
  var x=0,y=0,rx=0,ry=0,shown=false,last=0;
  function frame(t){
    var dt=Math.min(.05,(t-last)/1000||.016);last=t;
    var k=1-Math.exp(-dt/LAG);
    rx+=(x-rx)*k;ry+=(y-ry)*k;
    dot.style.transform='translate3d('+x+'px,'+y+'px,0)';
    ring.style.transform='translate3d('+rx+'px,'+ry+'px,0)';
    window.requestAnimationFrame(frame);
  }
  function state(el){
    var hot=el&&el.closest?el.closest(HOT):null;
    var text=hot?(hot.getAttribute('data-cursor')||''):'';
    [dot,ring].forEach(function(c){c.classList.toggle('is-hover',!!hot&&!text);c.classList.toggle('is-label',!!text);});
    if(text){label.textContent=text;}
  }
  window.addEventListener('pointermove',function(e){
    if(e.pointerType==='touch'){return;}
    x=e.clientX;y=e.clientY;
    if(!shown){shown=true;rx=x;ry=y;root.classList.add('has-cursor');window.requestAnimationFrame(frame);}
    root.classList.remove('cursor-out');
    state(e.target);
  },{passive:true});
  window.addEventListener('pointerdown',function(){dot.classList.add('is-down');ring.classList.add('is-down');},{passive:true});
  window.addEventListener('pointerup',function(){dot.classList.remove('is-down');ring.classList.remove('is-down');},{passive:true});
  document.addEventListener('mouseleave',function(){root.classList.add('cursor-out');});
  window.addEventListener('blur',function(){root.classList.add('cursor-out');});
})();

/* ===== 공통 ② 메뉴가 커서 쪽으로 끌려온다 (#2 마그네틱 버튼)
   메뉴 글자가 가운데에서 커서까지 거리의 0.25배만큼 따라오고(0.4초), 벗어나면 0.6초 동안 살짝 튕기며 제자리로 돌아간다. */
(function(){
  var root=document.documentElement;
  var fine=window.matchMedia&&window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  if(!fine||!root.classList.contains('motion')){return;}
  var PULL=0.25;
  document.querySelectorAll('.menu a').forEach(function(a){
    var inner=a.querySelector('.in');
    a.addEventListener('mousemove',function(e){
      var r=a.getBoundingClientRect();
      a.classList.remove('is-back');
      inner.style.transform='translate('+((e.clientX-(r.left+r.width/2))*PULL).toFixed(2)+'px,'+((e.clientY-(r.top+r.height/2))*PULL).toFixed(2)+'px)';
    });
    a.addEventListener('mouseleave',function(){a.classList.add('is-back');inner.style.transform='translate(0,0)';});
  });
})();
</script>
<script>
/* about — 스위치를 누르면 이 페이지의 밝은 화면과 어두운 화면이 바뀐다 (#20 테마 토글)
   노브가 0.25초에 22px 옮겨 가고, 배경·글자·선·스위치 색이 0.4초에 함께 바뀐다.
   스위치 옆 단어는 위로 6px 사라지고(0.16초) 새 단어가 아래 6px에서 올라온다(0.22초). 다시 누르면 되돌아간다. */
(function(){
  var sw=document.getElementById('mode-switch'),word=document.getElementById('mode-label');
  if(!sw||!word){return;}
  var root=document.documentElement,dark=false,motion=root.classList.contains('motion');
  sw.addEventListener('click',function(){
    dark=!dark;
    sw.setAttribute('aria-checked',dark?'true':'false');
    if(dark){root.setAttribute('data-mode','dark');}else{root.removeAttribute('data-mode');}
    var text=dark?'Dark':'Light';
    if(!motion){word.innerHTML='<span>'+text+'</span>';return;}
    var old=word.querySelector('span:last-child');
    word.querySelectorAll('.is-out').forEach(function(n){n.remove();});
    old.className='is-out';
    var neu=document.createElement('span');neu.className='is-inn';neu.textContent=text;
    word.appendChild(neu);
    window.setTimeout(function(){if(old.parentNode){old.remove();}},200);
  });
})();
</script>
</body>
</html>

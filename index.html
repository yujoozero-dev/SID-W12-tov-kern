<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kern</title>
<meta name="description" content="Kern — 글자 사이 1/1000 em을 고르는 일.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<script>
/* 움직임을 써도 되는 환경에서만 html에 motion 표시를 단다. 스크립트가 꺼져 있거나 '동작 줄이기'가 켜져 있으면 완성된 글이 바로 보인다. */
(function(){var d=document.documentElement;
  if(!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)){d.classList.add('motion');
    try{if(window.sessionStorage.getItem('kern-wipe')==='1'){d.classList.add('wipe-in');}}catch(e){}}
})();
</script>
<style>
/* ===== 공통 (세 페이지 동일) ===== */
:root{
  --paper:#F5F4F0; --ink:#111110; --accent:#2436E8; --line:rgba(17,17,16,.9); --muted:rgba(17,17,16,.56);
  --serif:"Instrument Serif","Times New Roman",serif;
  --sans:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --pad:20px;
  --out3:cubic-bezier(.165,.84,.44,1);   /* 끝에서 느려지는 곡선 */
  --out2:cubic-bezier(.25,.46,.45,.94);
}
html[data-mode="dark"]{--paper:#111110; --ink:#F5F4F0; --accent:#93A0FF; --line:rgba(245,244,240,.9); --muted:rgba(245,244,240,.6)}
@media (min-width:700px){:root{--pad:40px}}
@media (min-width:1200px){:root{--pad:64px}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{min-height:100vh;min-height:100svh;background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;font-size:16px;line-height:1.8;
  word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background-color .4s var(--out2),color .4s var(--out2)}
html{transition:background-color .4s var(--out2)}
::selection{background:var(--ink);color:var(--paper)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--accent);outline-offset:4px}

.site-head{padding:0 var(--pad)}
.menu{display:flex;gap:28px;align-items:center;height:64px;border-bottom:1px solid var(--line);transition:border-color .4s var(--out2);
  font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:none}
.menu a{display:inline-block;padding:12px 0;color:var(--muted);transition:color .25s var(--out2)}
.menu a:hover{color:var(--ink)}
.menu a .in{display:inline-block;transition:transform .4s var(--out2)}
.menu a.is-back .in{transition:transform .6s cubic-bezier(.34,1.7,.5,1)}
.menu a[aria-current="page"]{color:var(--ink);font-weight:500}
.menu a[aria-current="page"] .in{box-shadow:0 1px 0 0 var(--accent);padding-bottom:3px}

main{padding:0 var(--pad) 96px}
.title{font-family:var(--serif);font-weight:400;line-height:.86;letter-spacing:-.02em;font-size:clamp(84px,19vw,300px);padding:clamp(40px,9vh,112px) 0 clamp(28px,5vh,56px)}
.sub{font-family:var(--serif);font-weight:400;font-style:italic;line-height:1;letter-spacing:-.01em;font-size:clamp(40px,6.4vw,100px)}
.meta{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted)}
.prose{max-width:36em}
.prose p+p{margin-top:1.4em}

/* 페이지를 옮길 때 화면을 덮는 색 판 (#88) */
.wipe{position:fixed;left:0;top:0;width:100%;height:100%;z-index:990;background:var(--accent);transform:translateX(100%);pointer-events:none}
.wipe.is-cover{transform:none;transition:transform .4s cubic-bezier(.7,0,.3,1)}
html.wipe-in .wipe{transform:none}
html.wipe-in .wipe.is-leave{transform:translateX(-100%);transition:transform .4s cubic-bezier(.7,0,.3,1)}

/* 커서 (#6) — 마우스가 있는 기기에서만 켠다 */
.cur{position:fixed;left:0;top:0;z-index:999;pointer-events:none;opacity:0;transition:opacity .25s var(--out2);will-change:transform}
html.has-cursor .cur{opacity:1}
html.has-cursor.cursor-out .cur{opacity:0}
html.has-cursor,html.has-cursor *{cursor:none!important}
/* 커서를 따라다니는 잉크 잔상(캔버스) */
.cur-trail{width:100%;height:100%;z-index:997;mix-blend-mode:multiply}
html[data-mode="dark"] .cur-trail{mix-blend-mode:screen}
.cur-dot i{display:block;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--ink);transition:transform .25s var(--out2),background-color .4s var(--out2)}
.cur-ring i{display:block;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:1px solid var(--ink);
  transition:transform .25s var(--out2),border-color .25s var(--out2),background-color .25s var(--out2)}
.cur-ring b{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.06em;color:var(--paper);opacity:0;transition:opacity .2s var(--out2);white-space:nowrap}
.cur.is-hover.cur-ring i{transform:scale(1.8);border-color:var(--accent)}
.cur.is-hover.cur-dot i{background:var(--accent)}
.cur.is-label.cur-ring i{transform:scale(2.1);border-color:var(--ink);background:var(--ink)}
.cur.is-label.cur-ring b{opacity:1}
.cur.is-label.cur-dot i{transform:scale(0)}
.cur.is-down.cur-ring i{transform:scale(.8)}
.cur.is-hover.is-down.cur-ring i{transform:scale(1.5)}
.cur.is-label.is-down.cur-ring i{transform:scale(1.85)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

/* ===== index ===== */
.hero{display:grid;grid-template-columns:1fr;gap:clamp(20px,4vh,40px);padding-top:clamp(28px,6vh,72px)}
.lede{font-size:16px;line-height:1.8;max-width:22em}
.kern{font-family:var(--serif);font-weight:400;line-height:.8;font-size:max(104px,min(20vw,34vh));
  display:flex;align-items:flex-end;white-space:nowrap;padding:.06em 0 .1em;--k:0;user-select:none;-webkit-user-select:none}
.kern .ch{display:inline-block;transition:margin-left .3s var(--out2)}
.kern .ch+.ch{margin-left:calc(var(--k) * .001em)}
.motion .kern .ch{opacity:0;transform:translateY(40px)}
.motion .kern.is-in .ch{opacity:1;transform:none;
  transition:margin-left .3s var(--out2),transform .4s cubic-bezier(.22,1,.36,1) calc(var(--i) * .06s),opacity .4s ease-out calc(var(--i) * .06s)}
.motion .kern.is-done .ch{transition:margin-left .3s var(--out2)}
.dial{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;border-top:1px solid var(--line);padding-top:6px;max-width:720px}
.dial output{min-width:9.5em;text-align:right;color:var(--ink)}
.dial input{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;touch-action:pan-y}
.dial input::-webkit-slider-runnable-track{height:1px;background:var(--line)}
.dial input::-moz-range-track{height:1px;background:var(--line)}
.dial input::-webkit-slider-thumb{-webkit-appearance:none;width:3px;height:22px;margin-top:-11px;background:var(--accent);border:0;border-radius:0}
.dial input::-moz-range-thumb{width:3px;height:22px;background:var(--accent);border:0;border-radius:0}
.floor{position:relative;margin-top:clamp(8px,2vh,24px);height:max(260px,min(60vh,50vw + 110px))}
.floor canvas{display:block;width:100%;height:100%;touch-action:pan-y}
.floor-note{margin-top:10px;transition:opacity .6s var(--out2)}
.floor-note.is-off{opacity:0}
@media (min-width:900px){
  .hero{grid-template-columns:minmax(0,1fr) minmax(0,20em);align-items:start;column-gap:40px}
  .kern{grid-column:1;grid-row:1 / span 2}
  .lede{grid-column:2;grid-row:1;padding-top:.6em}
  .dial{grid-column:1 / -1}
}
@media (max-width:480px){.dial{grid-template-columns:1fr auto;row-gap:0}.dial .meta:first-child{grid-column:1 / -1;padding-top:10px}.dial output{min-width:0}}

/* 굴러가는 숫자 (#48) */
.roll{display:inline-flex;align-items:flex-end;line-height:1.15;vertical-align:bottom}
.roll .col{display:inline-block;height:1.15em;overflow:hidden}
.roll .strip{display:block;transition:transform .4s cubic-bezier(.25,.8,.25,1)}
.roll .strip b{display:block;height:1.15em;font-weight:400}
.dial output{display:inline-flex;justify-content:flex-end;align-items:flex-end;line-height:1.15;white-space:pre}
/* 원을 도는 글자 띠 (#57) */
.ring{width:88px;height:88px;justify-self:end;align-self:center}
.ring svg{display:block;width:100%;height:100%;overflow:visible}
.ring text{fill:var(--ink)}
.ring .ra text{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em}
.ring .rb text{font-family:var(--serif);font-style:italic;font-size:15px}
.ring .rl{fill:none;stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.5}
.ring .rd{fill:var(--accent)}
.hero{grid-template-columns:minmax(0,1fr) auto}
.kern,.dial{grid-column:1 / -1}
@media (min-width:900px){
  .hero{grid-template-columns:minmax(0,1fr) minmax(0,20em)}
  .kern{grid-column:1;grid-row:1 / span 2}
  .ring{grid-column:2;grid-row:2;width:clamp(140px,13vw,200px);height:clamp(140px,13vw,200px);align-self:end}
}

</style>
</head>
<body>
<div class="wipe" id="wipe" aria-hidden="true"></div>

<header class="site-head">
  <nav class="menu">
    <a href="index.html" aria-current="page"><span class="in">Index</span></a>
    <a href="detail.html"><span class="in">Spacing</span></a>
    <a href="about.html"><span class="in">Note</span></a>
  </nav>
</header>

<main>
  <div class="hero">
    <h1 class="kern" id="kern" aria-label="Kern"><span class="ch" style="--i:0" aria-hidden="true">K</span><span class="ch" style="--i:1" aria-hidden="true">e</span><span class="ch" style="--i:2" aria-hidden="true">r</span><span class="ch" style="--i:3" aria-hidden="true">n</span></h1>
    <p class="lede">글자 사이 1/1000 em을 고르는 일.</p>
    <div class="ring" id="ring" aria-hidden="true">
      <svg viewBox="0 0 200 200">
        <defs>
          <path id="ring-a" d="M16,100 a84,84 0 1,1 168,0 a84,84 0 1,1 -168,0"/>
          <path id="ring-b" d="M42,100 a58,58 0 1,1 116,0 a58,58 0 1,1 -116,0"/>
        </defs>
        <circle class="rl" cx="100" cy="100" r="72"/>
        <g class="ra" id="ring-ga"><text><textPath href="#ring-a" textLength="522" lengthAdjust="spacing">KERNING · LEADING · MARGIN · KERNING · LEADING · MARGIN · </textPath></text></g>
        <g class="rb" id="ring-gb"><text><textPath href="#ring-b" textLength="358" lengthAdjust="spacing">Space between · Space between · </textPath></text></g>
        <circle class="rd" cx="100" cy="100" r="3"/>
      </svg>
    </div>
    <div class="dial">
      <label class="meta" for="kern-range">Drag to kern</label>
      <input type="range" id="kern-range" min="-80" max="200" step="1" value="0" data-cursor="Drag">
      <output class="meta" id="kern-out" for="kern-range" aria-label="0 / 1000 em"><span class="roll" id="kern-roll" aria-hidden="true"></span><span aria-hidden="true"> / 1000 em</span></output>
    </div>
  </div>
  <div class="floor" id="floor"><canvas id="floor-canvas" aria-hidden="true"></canvas></div>
  <p class="meta floor-note" id="floor-note">Move across the grid</p>
</main>

<script>
/* ===== 공통 ① 커서 (#6 커스텀 커서)
   점은 포인터에 바로 붙고, 링은 0.18초쯤 늦게 따라온다. 링크·버튼 위에서는 링이 1.8배로 커진다.
   지나간 길에는 잉크 잔상이 0.9초 동안 번지며 사라진다.
   data-cursor 가 적힌 곳에서는 링이 채워지고 그 글자가 링 안에 보인다. 터치 기기와 '동작 줄이기'에서는 만들지 않는다. */
(function(){
  var root=document.documentElement;
  var fine=window.matchMedia&&window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  if(!fine||!root.classList.contains('motion')){return;}
  var LAG=0.06;            /* 링이 따라오는 시간 상수(초). 0.06이면 0.18초쯤에 거의 붙는다 */
  var HOT='a,button,input,[data-cursor]';
  function make(cls,html){var e=document.createElement('div');e.className='cur '+cls;e.setAttribute('aria-hidden','true');e.innerHTML=html;document.body.appendChild(e);return e;}
  var trail=document.createElement('canvas');trail.className='cur cur-trail';trail.setAttribute('aria-hidden','true');document.body.appendChild(trail);
  var tctx=trail.getContext('2d');
  var dot=make('cur-dot','<i></i>'), ring=make('cur-ring','<i></i><b></b>'), label=ring.querySelector('b');
  var x=0,y=0,rx=0,ry=0,shown=false,last=0;
  /* 잉크 잔상: 지나간 길에 6px 간격으로 번짐 자국을 남긴다. 자국은 0.9초 동안 반지름 10px → 26px로 번지며 옅어져 사라진다. */
  var LIFE=900,STEP=6,R0=10,R1=26,ALPHA=.2,pts=[],px=0,py=0,dpr=1,sprites={};
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);trail.width=Math.round(window.innerWidth*dpr);trail.height=Math.round(window.innerHeight*dpr);}
  function sprite(dark){
    var key=dark?'d':'l';if(sprites[key]){return sprites[key];}
    var c=document.createElement('canvas');c.width=c.height=64;var g=c.getContext('2d');
    var rg=g.createRadialGradient(32,32,0,32,32,32);
    if(dark){rg.addColorStop(0,'rgba(245,244,240,.95)');rg.addColorStop(.4,'rgba(147,160,255,.45)');rg.addColorStop(1,'rgba(147,160,255,0)');}
    else{rg.addColorStop(0,'rgba(17,17,16,.95)');rg.addColorStop(.4,'rgba(36,54,232,.4)');rg.addColorStop(1,'rgba(36,54,232,0)');}
    g.fillStyle=rg;g.fillRect(0,0,64,64);sprites[key]=c;return c;
  }
  function drop(nx,ny,now){
    var dx=nx-px,dy=ny-py,d=Math.sqrt(dx*dx+dy*dy);
    if(d<STEP){return;}
    var n=Math.min(40,Math.floor(d/STEP));
    for(var i=1;i<=n;i++){pts.push({x:px+dx*i/n,y:py+dy*i/n,t:now});}
    px=nx;py=ny;
    if(pts.length>400){pts.splice(0,pts.length-400);}
  }
  function paint(now){
    tctx.setTransform(dpr,0,0,dpr,0,0);
    tctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    if(!pts.length){return;}
    while(pts.length&&now-pts[0].t>LIFE){pts.shift();}
    var img=sprite(root.getAttribute('data-mode')==='dark');
    for(var i=0;i<pts.length;i++){
      var p=pts[i],a=(now-p.t)/LIFE,r=R0+(R1-R0)*a;
      tctx.globalAlpha=ALPHA*(1-a)*(1-a);
      tctx.drawImage(img,p.x-r,p.y-r,r*2,r*2);
    }
    tctx.globalAlpha=1;
  }
  size();window.addEventListener('resize',size);
  function frame(t){
    var dt=Math.min(.05,(t-last)/1000||.016);last=t;
    var k=1-Math.exp(-dt/LAG);
    rx+=(x-rx)*k;ry+=(y-ry)*k;
    dot.style.transform='translate3d('+x+'px,'+y+'px,0)';
    ring.style.transform='translate3d('+rx+'px,'+ry+'px,0)';
    paint(t);
    window.requestAnimationFrame(frame);
  }
  function state(el){
    var hot=el&&el.closest?el.closest(HOT):null;
    var text=hot?(hot.getAttribute('data-cursor')||''):'';
    [dot,ring].forEach(function(c){c.classList.toggle('is-hover',!!hot&&!text);c.classList.toggle('is-label',!!text);});
    if(text){label.textContent=text;}
  }
  window.addEventListener('pointermove',function(e){
    if(e.pointerType==='touch'){return;}
    x=e.clientX;y=e.clientY;
    if(!shown){shown=true;rx=x;ry=y;px=x;py=y;root.classList.add('has-cursor');window.requestAnimationFrame(frame);}
    drop(x,y,performance.now());
    root.classList.remove('cursor-out');
    state(e.target);
  },{passive:true});
  window.addEventListener('pointerdown',function(){dot.classList.add('is-down');ring.classList.add('is-down');},{passive:true});
  window.addEventListener('pointerup',function(){dot.classList.remove('is-down');ring.classList.remove('is-down');},{passive:true});
  document.addEventListener('mouseleave',function(){root.classList.add('cursor-out');});
  window.addEventListener('blur',function(){root.classList.add('cursor-out');});
})();

/* ===== 공통 ② 메뉴가 커서 쪽으로 끌려온다 (#2 마그네틱 버튼)
   메뉴 글자가 가운데에서 커서까지 거리의 0.25배만큼 따라오고(0.4초), 벗어나면 0.6초 동안 살짝 튕기며 제자리로 돌아간다. */
(function(){
  var root=document.documentElement;
  var fine=window.matchMedia&&window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  if(!fine||!root.classList.contains('motion')){return;}
  var PULL=0.25;
  document.querySelectorAll('.menu a').forEach(function(a){
    var inner=a.querySelector('.in');
    a.addEventListener('mousemove',function(e){
      var r=a.getBoundingClientRect();
      a.classList.remove('is-back');
      inner.style.transform='translate('+((e.clientX-(r.left+r.width/2))*PULL).toFixed(2)+'px,'+((e.clientY-(r.top+r.height/2))*PULL).toFixed(2)+'px)';
    });
    a.addEventListener('mouseleave',function(){a.classList.add('is-back');inner.style.transform='translate(0,0)';});
  });
})();

/* ===== 공통 ③ 메뉴를 누르면 색 판이 화면을 덮고, 다음 페이지에서 빠져나간다 (#88 색 판이 덮는 전환)
   강조색 판이 오른쪽 바깥에서 0.4초에 화면을 덮는다 → 다 덮이면 다음 페이지로 간다 → 새 페이지에서 판이 왼쪽으로 0.4초에 빠져나간다. */
(function(){
  var root=document.documentElement,w=document.getElementById('wipe');
  if(!w||!root.classList.contains('motion')){return;}
  var busy=false;
  if(root.classList.contains('wipe-in')){
    try{window.sessionStorage.removeItem('kern-wipe');}catch(e){}
    window.requestAnimationFrame(function(){window.requestAnimationFrame(function(){
      w.classList.add('is-leave');
      window.setTimeout(function(){root.classList.remove('wipe-in');w.classList.remove('is-leave');},460);
    });});
  }
  document.querySelectorAll('.menu a').forEach(function(a){
    a.addEventListener('click',function(e){
      if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button!==0){return;}
      e.preventDefault();
      if(busy||a.getAttribute('aria-current')==='page'){return;}
      busy=true;
      w.classList.add('is-cover');
      window.setTimeout(function(){
        try{window.sessionStorage.setItem('kern-wipe','1');}catch(err){}
        window.location.href=a.href;
      },400);
    });
  });
  window.addEventListener('pageshow',function(e){
    if(e.persisted){busy=false;w.classList.remove('is-cover','is-leave');root.classList.remove('wipe-in');}
  });
})();
</script>
<script>
/* index ① 제목이 한 자씩 올라온다 (#52 한 자씩 조립)
   글자마다 40px 아래·투명에서 제자리로 0.4초, 왼쪽부터 0.06초 간격. 한 번만 한다. */
(function(){
  var h=document.getElementById('kern');
  if(!h||!document.documentElement.classList.contains('motion')){return;}
  window.requestAnimationFrame(function(){window.requestAnimationFrame(function(){h.classList.add('is-in');});});
  window.setTimeout(function(){h.classList.add('is-done');},400+60*3+80);
})();

/* index ② 슬라이더 값이 제목의 글자 사이가 된다 (#18 슬라이더 매핑)
   -80 ~ 200 을 글자 사이 -0.08em ~ 0.2em 에 짝짓는다. 글자는 0.3초에 걸쳐 따라간다. */
(function(){
  var h=document.getElementById('kern'),r=document.getElementById('kern-range'),o=document.getElementById('kern-out');
  if(!h||!r||!o){return;}
  /* 수치는 바뀐 자리만 굴러간다 (#48 바뀐 자리만 굴러가는 숫자). 자릿수가 달라지면 굴리지 않고 바로 바꾼다. */
  var box=document.getElementById('kern-roll'),cols=[],sign=null;
  function build(n){
    box.innerHTML='';cols=[];
    sign=document.createElement('span');box.appendChild(sign);
    for(var i=0;i<n;i++){
      var c=document.createElement('span');c.className='col';
      var st=document.createElement('span');st.className='strip';
      for(var d=0;d<10;d++){var b=document.createElement('b');b.textContent=d;st.appendChild(b);}
      c.appendChild(st);box.appendChild(c);cols.push(st);
    }
  }
  function roll(v){
    var txt=String(Math.abs(v)),label=(v>0?'+':v<0?'−':'')+txt+' / 1000 em';
    o.setAttribute('aria-label',label);
    if(!box){o.textContent=label;return;}
    if(cols.length!==txt.length){
      build(txt.length);
      cols.forEach(function(st,i){st.style.transition='none';st.style.transform='translateY(-'+(txt.charAt(i)*1.15)+'em)';});
      void box.offsetWidth;
      cols.forEach(function(st){st.style.transition='';});
    }else{
      cols.forEach(function(st,i){st.style.transform='translateY(-'+(txt.charAt(i)*1.15)+'em)';});
    }
    sign.textContent=v>0?'+':v<0?'−':'';
  }
  function apply(){
    var v=parseInt(r.value,10)||0;
    h.style.setProperty('--k',v);
    roll(v);
  }
  r.addEventListener('input',apply);
  apply();
})();

/* index ③ 블록 바닥 (#65 솟아오르는 블록 바닥) + 슬라이더와 조합
   16×16 블록 바닥. 커서 아래 블록이 최대 60px 솟고 둘레도 언덕 모양으로 함께 솟는다.
   새 칸에 들어갈 때마다, 한 칸에 머무르면 0.65초마다 그 칸에서 물결이 초속 6.5칸으로 퍼진다(최대 30px, 2.6초 뒤 사라짐).
   높이는 스프링(강도 170, 감쇠 16)으로 따라간다. 누르면 그 칸에서 두 배 높이의 물결이 한 번 더 퍼진다.
   조합: 위 슬라이더 값이 블록 사이 간격도 정한다(-80 → 0.9배, 200 → 1.25배). */
(function(){
  var box=document.getElementById('floor'),cv=document.getElementById('floor-canvas'),note=document.getElementById('floor-note'),range=document.getElementById('kern-range');
  if(!box||!cv||!cv.getContext){return;}
  var ctx=cv.getContext('2d');
  var MOTION=document.documentElement.classList.contains('motion');
  var N=16,MAXH=60,WAVE_AMP=30,WAVE_SPEED=6.5,INTERVAL=0.65,STIFF=170,DAMP=16,SP_MAX=1.25;
  var C0=[231,229,222],C1=[17,17,16],EDGE='rgba(245,244,240,.55)',SHADOW='rgba(17,17,16,.06)';
  var W=0,H=0,tw=0,th=0,dep=0,ox=0,oy=0,MAX=MAXH,amp=WAVE_AMP;
  var sp=1,spTo=1;
  var h=new Float32Array(N*N),v=new Float32Array(N*N),tg=new Float32Array(N*N);
  var cur=null,ripples=[],lastCell=-1,lastSpawn=0,running=false,visible=true,prev=0;

  function spacing(){var k=range?(parseInt(range.value,10)||0):0;return k<0?1+k/800:1+k/800;}
  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    W=box.clientWidth;H=box.clientHeight;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    MAX=Math.min(MAXH,Math.round(H*0.15));amp=WAVE_AMP*MAX/MAXH;
    tw=Math.max(8,Math.min((W-8)/(N*SP_MAX),(H-MAX-28)/((N/2)*SP_MAX+0.4)));
    th=tw/2;dep=tw*0.4;
    ox=W/2;
    oy=(H-(N*th*SP_MAX+dep+MAX))/2+MAX;
    if(!running){draw();}
  }
  function pick(e){
    var r=cv.getBoundingClientRect();
    var a=(e.clientX-r.left-ox)/(sp*tw/2),b=(e.clientY-r.top-oy)/(sp*th/2);
    var i=Math.floor((a+b)/2),j=Math.floor((b-a)/2);
    if(i<0||j<0||i>=N||j>=N){return null;}
    return {i:i,j:j};
  }
  function spawn(i,j){var now=performance.now();ripples.push({i:i,j:j,t:now});lastSpawn=now;}
  function enter(e){
    cur=pick(e);
    if(cur){
      if(note){note.classList.add('is-off');}
      var id=cur.j*N+cur.i;
      if(id!==lastCell){lastCell=id;spawn(cur.i,cur.j);}
    }else{lastCell=-1;}
    start();
  }
  function leave(){cur=null;lastCell=-1;}
  function mix(t){return [C0[0]+(C1[0]-C0[0])*t,C0[1]+(C1[1]-C0[1])*t,C0[2]+(C1[2]-C0[2])*t];}
  function rgb(c,f){return 'rgb('+Math.round(c[0]*f)+','+Math.round(c[1]*f)+','+Math.round(c[2]*f)+')';}
  function block(i,j,lift){
    var x=ox+(i-j)*sp*tw/2,y=oy+(i+j)*sp*th/2-lift;
    var t=Math.max(0,Math.min(1,lift/MAX)),c=mix(Math.pow(t,0.75));
    var hw=tw/2,hq=th/2,fh=lift+dep;
    ctx.beginPath();ctx.moveTo(x-hw,y+hq);ctx.lineTo(x,y+th);ctx.lineTo(x,y+th+fh);ctx.lineTo(x-hw,y+hq+fh);ctx.closePath();
    ctx.fillStyle=rgb(c,.82);ctx.fill();
    ctx.beginPath();ctx.moveTo(x+hw,y+hq);ctx.lineTo(x,y+th);ctx.lineTo(x,y+th+fh);ctx.lineTo(x+hw,y+hq+fh);ctx.closePath();
    ctx.fillStyle=rgb(c,.68);ctx.fill();
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+hw,y+hq);ctx.lineTo(x,y+th);ctx.lineTo(x-hw,y+hq);ctx.closePath();
    ctx.fillStyle=rgb(c,1);ctx.fill();
    ctx.strokeStyle=EDGE;ctx.lineWidth=1;ctx.stroke();
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    var sy=oy+dep+8,fw=N*sp*tw/2,fh=N*sp*th/2;
    ctx.beginPath();ctx.moveTo(ox,sy);ctx.lineTo(ox+fw,sy+fh);ctx.lineTo(ox,sy+fh*2);ctx.lineTo(ox-fw,sy+fh);ctx.closePath();
    ctx.fillStyle=SHADOW;ctx.fill();
    for(var s=0;s<=2*(N-1);s++){
      for(var i=Math.max(0,s-N+1);i<=Math.min(N-1,s);i++){var j=s-i;block(i,j,h[j*N+i]);}
    }
  }
  function frame(now){
    if(!running){return;}
    var dt=Math.min(0.033,(now-prev)/1000);prev=now;
    if(cur&&now-lastSpawn>INTERVAL*1000){spawn(cur.i,cur.j);}
    ripples=ripples.filter(function(r){return now-r.t<2600;});
    var i,j,k,n,r,dx,dy,t,s,d,q,age,a,energy=0;
    for(j=0;j<N;j++){for(i=0;i<N;i++){
      t=0;
      if(cur){dx=i-cur.i;dy=j-cur.j;t=MAX*Math.exp(-(dx*dx+dy*dy)/0.55);}
      s=0;
      for(n=0;n<ripples.length;n++){
        r=ripples[n];age=(now-r.t)/1000;dx=i-r.i;dy=j-r.j;d=Math.sqrt(dx*dx+dy*dy);
        if(d<0.5){continue;}
        q=d-age*WAVE_SPEED;
        s+=amp*(r.k||1)*Math.exp(-age*1.7)*Math.exp(-q*q/1.1);
      }
      tg[j*N+i]=Math.min(MAX,Math.max(t,s));
    }}
    for(k=0;k<N*N;k++){
      a=(tg[k]-h[k])*STIFF-v[k]*DAMP;
      v[k]+=a*dt;h[k]+=v[k]*dt;
      if(h[k]>MAX){h[k]=MAX;if(v[k]>0){v[k]=0;}}
      if(h[k]<-3){h[k]=-3;if(v[k]<0){v[k]=0;}}
      energy+=Math.abs(h[k])+Math.abs(v[k]);
    }
    sp+=(spTo-sp)*(1-Math.exp(-dt/0.1));
    draw();
    /* 다 가라앉았고 커서도 물결도 없으면 그리기를 멈춘다 */
    if(!cur&&!ripples.length&&energy<0.5&&Math.abs(spTo-sp)<0.0005){sp=spTo;draw();running=false;return;}
    window.requestAnimationFrame(frame);
  }
  function start(){
    if(running||!visible||!MOTION){return;}
    running=true;prev=performance.now();window.requestAnimationFrame(frame);
  }
  if(range){range.addEventListener('input',function(){spTo=spacing();if(MOTION){start();}else{sp=spTo;draw();}});}
  if(note&&!(window.matchMedia&&window.matchMedia('(hover:hover) and (pointer:fine)').matches)){note.textContent='Tap the grid';}
  sp=spTo=spacing();
  window.addEventListener('resize',resize);
  resize();
  if(!MOTION){return;}   /* '동작 줄이기'에서는 평평한 바닥만 그려 둔다 */
  cv.addEventListener('pointermove',enter);
  cv.addEventListener('pointerdown',function(e){enter(e);if(cur){ripples.push({i:cur.i,j:cur.j,t:performance.now(),k:2});}});
  cv.addEventListener('pointerleave',leave);
  cv.addEventListener('pointercancel',leave);
  cv.addEventListener('pointerup',function(e){if(e.pointerType!=='mouse'){leave();}});
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(list){visible=list[0].isIntersecting;if(!visible){running=false;leave();}},{threshold:0}).observe(box);
  }
})();
</script><script>
/* index ④ 원을 도는 글자 띠 (#57 원을 도는 글자 띠)
   스크롤 100px마다 15도 돈다. 바깥 띠는 시계 방향, 안쪽 띠는 반시계 방향. 가만히 있어도 1초에 6도씩 천천히 돈다. */
(function(){
  var ga=document.getElementById('ring-ga'),gb=document.getElementById('ring-gb'),ring=document.getElementById('ring');
  if(!ga||!gb||!document.documentElement.classList.contains('motion')){return;}
  var DRIFT=6,PER=0.15,t0=performance.now(),on=true;
  function frame(now){
    if(!on){return;}
    var a=(window.pageYOffset||0)*PER+(now-t0)/1000*DRIFT;
    ga.setAttribute('transform','rotate('+a.toFixed(2)+' 100 100)');
    gb.setAttribute('transform','rotate('+(-a).toFixed(2)+' 100 100)');
    window.requestAnimationFrame(frame);
  }
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(l){var v=l[0].isIntersecting;if(v&&!on){on=true;window.requestAnimationFrame(frame);}else if(!v){on=false;}},{threshold:0}).observe(ring);
  }
  window.requestAnimationFrame(frame);
})();
</script>
</body>
